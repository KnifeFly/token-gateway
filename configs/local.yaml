environment: local

service:
  name: token-gateway
  version: dev

http:
  addr: ":9501"
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
  max_header_bytes: 1048576

database:
  enabled: true
  driver: mysql
  dsn: "token_gateway:token_gateway@tcp(127.0.0.1:3306)/token_gateway?parseTime=true&multiStatements=true"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  migrations_dir: migrations/mysql

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  tls: false
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

telemetry:
  log_level: info
  log_format: text
  metrics_enabled: true
  tracing:
    enabled: false
    exporter: noop

gateway:
  body:
    max_bytes: 4194304
  snapshot:
    soft_ttl: 30s
    hard_ttl: 2m
  protocol:
    default_mode: auto
  idempotency:
    ttl: 24h
  seed_snapshot:
    enabled: true
    api_key: "tg-local-dev-key"
    api_key_id: "key_local"
    tenant_id: "tenant_local"
    project_id: "project_local"
    model: "gpt-4o-mini"
    upstream_model: "gpt-4o-mini"
    provider_type: "openai_compatible"
    channel_id: "channel_mock_openai"
    provider_base_url: "mock://openai"
    provider_api_key: ""
    route_strategy: "priority"
    route_priority: 1
    route_weight: 100
    channel_timeout: 30s
  billing:
    enabled: true
    currency: USD
    input_micros_per_token: 1
    output_micros_per_token: 2
    estimated_output_tokens: 256
    hold_ttl: 10m
    local_seed_balance_micros: 1000000000
  limits:
    enabled: true
    rpm: 3600
    qps: 60
    tpm: 60000
    concurrency: 100
    window: 1s
    lease_ttl: 30s
    deny_cache_ttl: 1s
    key_prefix: token-gateway-local

control:
  addr: ":9502"
  admin_token: "local-admin-token"
  credential_key: "local-control-plane-credential-key"
  snapshot_poll_interval: 5s
  revocation_ttl: 24h

worker:
  enabled: false
  addr: ":9503"
  shutdown_timeout: 10s
  lease_ttl: 30s
  job_timeout: 30s
  provider_task_poll_interval: 5s
  failed_settlement_interval: 1m
  hold_reaper_interval: 1m
  reconciliation_interval: 15m
  callback_interval: 5s
  batch_size: 100

configd:
  addr: ":9504"
  shutdown_timeout: 10s
  publish_on_start: false
