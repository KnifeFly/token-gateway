environment: local

service:
  name: token-gateway
  version: dev

http:
  addr: ":9501"
  read_header_timeout: 5s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 60s
  shutdown_timeout: 10s
  max_header_bytes: 1048576

database:
  enabled: true
  driver: mysql
  dsn: "token_gateway:token_gateway@tcp(127.0.0.1:3306)/token_gateway?parseTime=true&multiStatements=true"
  max_open_conns: 10
  max_idle_conns: 5
  conn_max_lifetime: 30m
  migrations_dir: migrations/mysql

redis:
  enabled: true
  addr: "127.0.0.1:6379"
  username: ""
  password: ""
  db: 0
  tls: false
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

telemetry:
  log_level: info
  log_format: text
  metrics_enabled: true
  tracing:
    enabled: false
    exporter: noop

gateway:
  body:
    max_bytes: 4194304
  snapshot:
    soft_ttl: 30s
    hard_ttl: 2m
  protocol:
    default_mode: auto
  idempotency:
    ttl: 24h

worker:
  enabled: false
