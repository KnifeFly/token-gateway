name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.2"
          cache: true
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Format check
        run: |
          unformatted="$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
          test -z "$unformatted" || (echo "$unformatted" && exit 1)
      - name: Race
        run: go test -race ./...
      - name: Build
        run: go build ./cmd/...
