components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
    adminTokenAuth:
      type: apiKey
      in: header
      name: X-Admin-Token
  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
    ErrorObject:
      type: object
      required:
      - code
      - message
      - type
      properties:
        code:
          type: string
          enum:
          - invalid_request
          - invalid_parameters
          - unauthorized
          - forbidden
          - insufficient_balance
          - quota_exceeded
          - rate_limited
          - content_policy_violation
          - provider_error
          - service_error
          - service_unavailable
          - generation_timeout
          - resource_not_found
          - unknown_error
        message:
          type: string
        type:
          type: string
          example: invalid_request_error
        request_id:
          type: string
        retryable:
          type: boolean
        param:
          type: string
          nullable: true
    ModelObject:
      type: object
      required:
      - id
      - object
      - type
      - capabilities
      properties:
        id:
          type: string
          example: seedance-2.0-text-to-video
        object:
          type: string
          example: model
        type:
          type: string
          enum:
          - text
          - image
          - video
          - audio
          - embedding
          - moderation
          - multimodal
        display_name:
          type: string
        owner:
          type: string
          example: platform
        capabilities:
          type: array
          items:
            type: string
          example:
          - video_generation
          - text_to_video
        input_modalities:
          type: array
          items:
            type: string
          example:
          - text
          - image
        output_modalities:
          type: array
          items:
            type: string
          example:
          - video
        async:
          type: boolean
        deprecated:
          type: boolean
          default: false
    ModelListResponse:
      type: object
      required:
      - object
      - data
      properties:
        object:
          type: string
          example: list
        data:
          type: array
          items:
            $ref: '#/components/schemas/ModelObject'
    ModelSchemaResponse:
      type: object
      required:
      - model
      - schema
      properties:
        model:
          type: string
        version:
          type: string
        schema:
          type: object
          additionalProperties: true
    CreditsResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          properties:
            token:
              $ref: '#/components/schemas/CreditBucket'
            user:
              $ref: '#/components/schemas/CreditBucket'
            account:
              $ref: '#/components/schemas/CreditBucket'
    CreditBucket:
      type: object
      properties:
        remaining_credits:
          type: number
          format: double
        used_credits:
          type: number
          format: double
        unlimited_credits:
          type: boolean
          default: false
        currency:
          type: string
          example: CNY
    PortalUsageResponse:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        currency:
          type: string
          example: CNY
        totals:
          type: object
          properties:
            requests:
              type: integer
            input_tokens:
              type: integer
              format: int64
            output_tokens:
              type: integer
              format: int64
            credits_used:
              type: number
              format: double
        items:
          type: array
          items:
            type: object
            properties:
              request_id:
                type: string
              api_key_id:
                type: string
              model:
                type: string
              capability:
                type: string
              status:
                type: string
              input_tokens:
                type: integer
                format: int64
              output_tokens:
                type: integer
                format: int64
              credits_used:
                type: number
                format: double
              created_at:
                type: string
                format: date-time
        next_cursor:
          type: string
          nullable: true
    PortalAPIKey:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    PortalAPIKeyListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/PortalAPIKey'
    PortalAPIKeyCreateRequest:
      type: object
      properties:
        name:
          type: string
        allowed_models:
          type: array
          description: Must be a subset of the current API key allowed_models.
          items:
            type: string
    PortalAPIKeyCreateResponse:
      type: object
      properties:
        api_key:
          $ref: '#/components/schemas/PortalAPIKey'
        plaintext_key:
          type: string
          description: Returned once when the key is created.
    PortalTaskListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/TaskObject'
        next_cursor:
          type: string
          nullable: true
    AdminTenant:
      type: object
      required:
      - id
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminProject:
      type: object
      required:
      - id
      - tenant_id
      properties:
        id:
          type: string
        tenant_id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AdminAPIKey:
      type: object
      required:
      - tenant_id
      - project_id
      properties:
        id:
          type: string
        tenant_id:
          type: string
        project_id:
          type: string
        name:
          type: string
        key_hash:
          type: string
          readOnly: true
        plaintext_key:
          type: string
          writeOnly: true
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        revoked_at:
          type: string
          format: date-time
          nullable: true
    AdminModelConfig:
      type: object
      required:
      - public_model
      - protocol
      - capability
      properties:
        public_model:
          type: string
        aliases:
          type: array
          items:
            type: string
        display_name:
          type: string
        description:
          type: string
        protocol:
          type: string
          enum:
          - native_openai
          - native_claude
          - native_gemini
          - unified
        capability:
