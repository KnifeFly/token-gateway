openapi: 3.0.3
info:
  title: Commercial AI Gateway OpenAPI
  version: 1.0.0
  description: '商用 AI Gateway 对外 OpenAPI 最终设计合同。


    本合同综合 v0.2 和 v0.3 设计，重点约束：

    - 明确 Native Compatible API 与 Unified Media API 的协议消歧机制。

    - 对可能冲突的 URI 增加 X-Gateway-Protocol header。

    - 异步任务创建接口支持 Idempotency-Key，避免客户端重试导致重复扣费或重复生成。

    - 文件接口只表达 transient/non-storage input asset，用于请求归一化和转发，不承诺对象存储、下载或生命周期管理。

    - Portal API 提供客户自助模型、schema、credits、usage、API key 和 task 查询能力。

    - 预留 Realtime Session 接口，用于未来 WebSocket / WebRTC 长连接协议。

    - 统一错误码增加 ambiguous_protocol、idempotency_conflict、snapshot_stale、model_schema_mismatch 等建议值。


    设计原则：

    - 统一资源 URI：例如 /v1/images/generations、/v1/videos/generations。

    - 通过 model 参数选择具体模型、供应商或模型族。

    - 长耗时媒体生成统一返回异步 task。

    - 原生兼容 OpenAI、Claude、Gemini 常用协议。

    - 所有接口默认使用 Authorization: Bearer <API_KEY>。

    '
servers:
- url: https://api.example.com
  description: Production
- url: http://localhost:9501
  description: Local
security:
- bearerAuth: []
tags:
- name: Models
- name: Credits
- name: Portal
- name: Files
- name: Tasks
- name: Unified Image
- name: Unified Video
- name: Unified Audio
- name: OpenAI Compatible
- name: Claude Compatible
- name: Gemini Compatible
- name: Moderation
- name: Admin
paths:
  /v1/models:
    get:
      tags:
      - Models
      summary: List routeable models
      operationId: listModels
      responses:
        '200':
          description: Model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters: []
  /v1/models/{model}/schema:
    get:
      tags:
      - Models
      summary: Get model parameter schema
      description: 返回指定模型的参数 schema，用于前端动态表单、Apifox 示例和运行时校验。
      operationId: getModelSchema
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Model schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSchemaResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/credits:
    get:
      tags:
      - Credits
      summary: Get credits and usage
      operationId: getCredits
      responses:
        '200':
          description: Credit balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters: []
  /v1/portal/models:
    get:
      tags:
      - Portal
      summary: List portal-visible models
      description: 返回当前 API key 所属 tenant/project 可见模型，结果不得包含不可路由或无权限模型。
      operationId: portalListModels
      responses:
        '200':
          description: Portal model list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/models/{model}/schema:
    get:
      tags:
      - Portal
      summary: Get portal-visible model schema
      description: 返回当前 API key 可访问模型的动态参数 schema。
      operationId: portalGetModelSchema
      parameters:
      - name: model
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Portal model schema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelSchemaResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/credits:
    get:
      tags:
      - Portal
      summary: Get portal credits
      description: 返回当前 tenant/project 的客户视角余额和已用额度，不暴露内部 ledger 修复细节或 provider 成本。
      operationId: portalGetCredits
      responses:
        '200':
          description: Portal credits
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreditsResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/usage:
    get:
      tags:
      - Portal
      summary: Get portal usage report
      description: 返回当前 tenant/project 的用量和扣费摘要，按 API key 权限过滤。
      operationId: portalGetUsage
      parameters:
      - name: from
        in: query
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Portal usage report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalUsageResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/api-keys:
    get:
      tags:
      - Portal
      summary: List portal API keys
      description: 列出当前 tenant/project 下由 portal 可见的 API key，不返回 plaintext key。
      operationId: portalListAPIKeys
      responses:
        '200':
          description: Portal API key list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAPIKeyListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
      - Portal
      summary: Create portal API key
      description: 在当前 tenant/project 下创建派生 API key。allowed_models 必须是当前 key 权限子集，不能扩大权限或额度。
      operationId: portalCreateAPIKey
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortalAPIKeyCreateRequest'
      responses:
        '200':
          description: Portal API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAPIKeyCreateResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/api-keys/{key_id}/disable:
    post:
      tags:
      - Portal
      summary: Disable portal API key
      description: 禁用当前 tenant/project 下可管理的派生 API key。
      operationId: portalDisableAPIKey
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: key_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Portal API key disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalAPIKey'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/tasks:
    get:
      tags:
      - Portal
      summary: List portal tasks
      description: 返回当前 tenant/project 范围内的异步任务列表，不暴露 provider secret、内部错误或敏感 metadata。
      operationId: portalListTasks
      parameters:
      - name: status
        in: query
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: cursor
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Portal task list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortalTaskListResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/portal/tasks/{task_id}:
    get:
      tags:
      - Portal
      summary: Get portal task detail
      description: 返回当前 tenant/project 范围内的任务详情。
      operationId: portalGetTask
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Portal task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/tasks/{task_id}:
    get:
      tags:
      - Tasks
      summary: Get async task detail
      operationId: getTaskDetail
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/tasks/{task_id}/cancel:
    post:
      tags:
      - Tasks
      summary: Cancel async task
      operationId: cancelTask
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: task_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Task cancelled or cancel request accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1/files/upload/base64:
    post:
      tags:
      - Files
      summary: Register transient Base64 input asset
      description: 接收 Base64 或 data URL 输入用于请求归一化、幂等校验和 provider 转发。Gateway 不做对象存储，不承诺持久化、下载地址或生命周期管理。
      operationId: uploadFileBase64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Base64FileUploadRequest'
      responses:
        '200':
          description: Transient input asset accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/files/upload/url:
    post:
      tags:
      - Files
      summary: Register transient URL input asset
      description: 接收远程 URL 输入用于 provider 转发和 metadata 记录。Gateway 不下载并托管对象，不承诺该 URL 的可用性或生命周期。
      operationId: uploadFileUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlFileUploadRequest'
      responses:
        '200':
          description: Transient input asset accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/files/upload/stream:
    post:
      tags:
      - Files
      summary: Register transient multipart input asset
      description: 接收 multipart 输入用于请求级处理和 provider 转发。Gateway 不提供对象存储或长期下载服务。
      operationId: uploadFileStream
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                upload_path:
                  type: string
                uploadPath:
                  type: string
                  description: camelCase alias of upload_path
                file_name:
                  type: string
                fileName:
                  type: string
                  description: camelCase alias of file_name
      responses:
        '200':
          description: Transient input asset accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileUploadResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/files/quota:
    get:
      tags:
      - Files
      summary: Get transient input asset quota
      description: 返回 transient input asset 的数量和大小限制，用于请求保护；该额度不是对象存储容量。
      operationId: getFileQuota
      responses:
        '200':
          description: File quota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileQuotaResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters: []
  /v1/images/generations:
    post:
      tags:
      - Unified Image
      summary: Create image generation task
      description: '统一生图接口。通过 model 参数选择具体模型，例如 gemini-3.1-flash-image-preview、nano-banana-2-beta、gpt-image-1、seedream-4.5 等。


        协议消歧：该 URI 与 OpenAI Images API 存在重叠。默认 X-Gateway-Protocol=auto，网关按 model registry 和 body schema 推断；建议统一媒体客户端显式传 X-Gateway-Protocol: unified。若请求无法消歧，返回 ambiguous_protocol。


        支持文生图、图生图、图像编辑。长耗时模型默认返回异步 task。'
      operationId: createImageGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageGenerationRequest'
            examples:
              textToImage:
                summary: Text to image
                value:
                  model: gemini-3.1-flash-image-preview
                  prompt: 一只猫在草地上玩耍，电影光影
                  size: '1:1'
                  quality: 2K
              imageEdit:
                summary: Image edit
                value:
                  model: gpt-image-1
                  prompt: 将图片中的天空改成晚霞
                  image_urls:
                  - https://example.com/input.png
                  size: '16:9'
                  model_params:
                    seed: 12345
      responses:
        '200':
          description: Image task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XGatewayProtocol'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/images/edits:
    post:
      tags:
      - Unified Image
      summary: Create image edit task
      operationId: createImageEdit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImageEditRequest'
      responses:
        '200':
          description: Image edit task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XGatewayProtocol'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/videos/generations:
    post:
      tags:
      - Unified Video
      summary: Create video generation task
      description: '统一生视频接口。通过 model 参数选择具体模型或模式。

        支持文生视频、图生视频、首尾帧视频、多模态参考视频。

        '
      operationId: createVideoGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VideoGenerationRequest'
            examples:
              textToVideo:
                summary: Text to video
                value:
                  model: seedance-2.0-text-to-video
                  prompt: 一只猫在钢琴上弹奏月光奏鸣曲，电影感光影，特写镜头
                  duration: 8
                  quality: 720p
                  aspect_ratio: '16:9'
                  generate_audio: true
              imageToVideo:
                summary: Image to video
                value:
                  model: seedance-2.0-image-to-video
                  prompt: 让图片中的人物缓慢转身，镜头向前推进
                  image_urls:
                  - https://example.com/first-frame.png
                  duration: 5
                  quality: 720p
                  aspect_ratio: adaptive
              referenceToVideo:
                summary: Reference to video
                value:
                  model: seedance-2.0-reference-to-video
                  prompt: 首帧使用图片1，全程参考视频1的运镜，音频1作为背景音乐
                  image_urls:
                  - https://example.com/character.png
                  video_urls:
                  - https://example.com/camera.mp4
                  audio_urls:
                  - https://example.com/bgm.mp3
                  duration: 10
                  quality: 1080p
      responses:
        '200':
          description: Video task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/audio/speech:
    post:
      tags:
      - Unified Audio
      summary: Create speech audio
      operationId: createSpeech
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpeechRequest'
      responses:
        '200':
          description: Speech response or task
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/TaskObject'
                - $ref: '#/components/schemas/AudioObject'
            audio/mpeg:
              schema:
                type: string
                format: binary
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XGatewayProtocol'
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 语音合成接口。该 URI 可兼容 OpenAI audio speech，也可作为统一媒体协议使用。建议通过 X-Gateway-Protocol 显式声明 native_openai 或 unified。
  /v1/audio/transcriptions:
    post:
      tags:
      - Unified Audio
      summary: Transcribe audio
      operationId: createTranscription
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - model
              - file
              properties:
                model:
                  type: string
                  example: whisper-1
                file:
                  type: string
                  format: binary
                language:
                  type: string
                prompt:
                  type: string
                response_format:
                  type: string
                  enum:
                  - json
                  - text
                  - srt
                  - verbose_json
                  - vtt
                  default: json
                temperature:
                  type: number
                  minimum: 0
                  maximum: 1
      responses:
        '200':
          description: Transcription result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
            text/plain:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XGatewayProtocol'
      - $ref: '#/components/parameters/IdempotencyKey'
      description: 音频转写接口。该 URI 可兼容 OpenAI audio transcription，也可作为统一媒体协议使用。建议通过 X-Gateway-Protocol 显式声明 native_openai 或 unified。
  /v1/music/generations:
    post:
      tags:
      - Unified Audio
      summary: Create music generation task
      operationId: createMusicGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicGenerationRequest'
      responses:
        '200':
          description: Music generation task created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskObject'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/IdempotencyKey'
  /v1/chat/completions:
    post:
      tags:
      - OpenAI Compatible
      summary: OpenAI-compatible chat completions
      operationId: createChatCompletion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIChatCompletionRequest'
      responses:
        '200':
          description: Chat completion response or SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OpenAIChatCompletionResponse'
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
  /v1/responses:
    post:
      tags:
      - OpenAI Compatible
      summary: OpenAI-compatible Responses API
      operationId: createResponse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenAIResponseRequest'
      responses:
        '200':
          description: Response object or SSE stream
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
  /v1/embeddings:
    post:
      tags:
      - OpenAI Compatible
      summary: OpenAI-compatible embeddings
      operationId: createEmbedding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
      responses:
        '200':
          description: Embedding response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
  /v1/messages:
    post:
      tags:
      - Claude Compatible
      summary: Claude-compatible Messages API
      operationId: createClaudeMessage
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: anthropic-version
        in: header
        required: false
        schema:
          type: string
        description: Optional Claude API version compatibility header.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClaudeMessageRequest'
      responses:
        '200':
          description: Claude message response or SSE stream
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClaudeMessageResponse'
            text/event-stream:
              schema:
                type: string
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1beta/models/{model}:generateContent:
    post:
      tags:
      - Gemini Compatible
      summary: Gemini-compatible generateContent
      operationId: geminiGenerateContent
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - name: model
        in: path
        required: true
        schema:
          type: string
        example: gemini-2.5-pro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GeminiGenerateContentRequest'
      responses:
        '200':
          description: Gemini GenerateContent response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        default:
          $ref: '#/components/responses/ErrorResponse'
  /v1beta/models/{model}:streamGenerateContent:
    post:
      tags:
      - Gemini Compatible
      summary: Gemini-compatible streamGenerateContent
      operationId: geminiStreamGenerateContent
      parameters:
