          enum:
          - pcm16
          - g711_ulaw
          - g711_alaw
          - opus
        metadata:
          type: object
          additionalProperties: true
    RealtimeSessionResponse:
      type: object
      required:
      - id
      - object
      - expires_at
      properties:
        id:
          type: string
        object:
          type: string
          example: realtime.session
        client_secret:
          type: string
          description: 短期连接 token。只返回一次。
        expires_at:
          type: integer
          format: int64
        websocket_url:
          type: string
          format: uri
        webrtc_url:
          type: string
          format: uri
    ProtocolMode:
      type: string
      enum:
      - auto
      - unified
      - native_openai
      - native_claude
      - native_gemini
      description: 网关协议模式。
    IdempotencyRecord:
      type: object
      properties:
        key:
          type: string
        scope:
          type: string
        request_hash:
          type: string
        resource_id:
          type: string
        expires_at:
          type: integer
          format: int64
  parameters:
    XGatewayProtocol:
      name: X-Gateway-Protocol
      in: header
      required: false
      description: 协议消歧 header。auto 表示由网关根据 path、model、body schema 自动推断；unified 表示使用网关统一媒体协议；native_openai/native_claude/native_gemini 表示使用对应原生兼容协议。对 /v1/images/generations、/v1/audio/* 等可能重叠的 URI，建议客户端显式传 unified 或 native_openai。
      schema:
        type: string
        enum:
        - auto
        - unified
        - native_openai
        - native_claude
        - native_gemini
        default: auto
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 幂等提交键。用于异步媒体任务、文件上传、扣费型写操作。相同租户、相同 API key、相同 endpoint、相同 Idempotency-Key 在幂等窗口内必须返回同一个 task 或同一个文件对象；请求体 hash 不一致时返回 idempotency_conflict。
      schema:
        type: string
        maxLength: 128
    XRequestID:
      name: X-Request-Id
      in: header
      required: false
      description: 客户端请求 ID。网关会在响应中返回内部 request_id，并在日志、trace、audit、usage record 中关联。
      schema:
        type: string
        maxLength: 128
