openapi: 3.0.3
info:
  title: token-gateway Portal Web BFF
  version: 0.2.0
  description: Browser-facing Portal BFF contract owned by cmd/console.
servers:
  - url: http://localhost:9505
    description: Local console process
tags:
  - name: Portal Web Auth
  - name: Portal Web Dashboard
  - name: Portal Web Models
  - name: Portal Web Usage
  - name: Portal Web API Keys
  - name: Portal Web Tasks
  - name: Portal Web Settings
paths:
  /api/portal/v1/auth/api-key-login:
    post:
      tags:
        - Portal Web Auth
      summary: Exchange a customer API key for a browser session
      operationId: loginPortalWithAPIKey
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyLoginRequest"
      responses:
        "200":
          description: Portal session and CSRF token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "503":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/auth/logout:
    post:
      tags:
        - Portal Web Auth
      summary: Revoke the current Portal browser session
      operationId: logoutPortalSession
      security:
        - portalSession: []
          csrfHeader: []
      responses:
        "200":
          description: Logout state
          content:
            application/json:
              schema:
                type: object
                required:
                  - authenticated
                properties:
                  authenticated:
                    type: boolean
                    enum:
                      - false
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/auth/me:
    get:
      tags:
        - Portal Web Auth
      summary: Get the current Portal browser session
      operationId: getPortalSession
      security:
        - portalSession: []
      responses:
        "200":
          description: Portal browser session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalSessionResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/dashboard:
    get:
      tags:
        - Portal Web Dashboard
      summary: Get Portal dashboard data
      operationId: getPortalDashboard
      security:
        - portalSession: []
      responses:
        "200":
          description: Portal dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalDashboardResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/onboarding:
    get:
      tags:
        - Portal Web Dashboard
      summary: Get Portal onboarding checklist
      operationId: getPortalOnboarding
      security:
        - portalSession: []
      responses:
        "200":
          description: Portal onboarding checklist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/models:
    get:
      tags:
        - Portal Web Models
      summary: List customer-visible models
      operationId: listPortalModels
      security:
        - portalSession: []
      responses:
        "200":
          description: Customer-visible models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelListResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/models/{model}/schema:
    get:
      tags:
        - Portal Web Models
      summary: Get a customer-visible model schema
      operationId: getPortalModelSchema
      security:
        - portalSession: []
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model schema
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelSchemaResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/models/{model}:
    get:
      tags:
        - Portal Web Models
      summary: Get a customer-visible model preview
      operationId: getPortalModel
      security:
        - portalSession: []
      parameters:
        - name: model
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Model preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModelDetailResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/credits:
    get:
      tags:
        - Portal Web Usage
      summary: Get customer credit buckets
      operationId: getPortalCredits
      security:
        - portalSession: []
      parameters:
        - name: currency
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Credit buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditsResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/usage:
    get:
      tags:
        - Portal Web Usage
      summary: Get customer usage rows
      operationId: getPortalUsage
      security:
        - portalSession: []
      parameters:
        - name: api_key_id
          in: query
          required: false
          schema:
            type: string
        - name: request_id
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: provider_type
          in: query
          required: false
          schema:
            type: string
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: currency
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Usage rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/usage/export:
    get:
      tags:
        - Portal Web Usage
      summary: Reserved usage export endpoint
      operationId: exportPortalUsage
      security:
        - portalSession: []
      responses:
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/api-keys:
    get:
      tags:
        - Portal Web API Keys
      summary: List safe API key metadata
      operationId: listPortalAPIKeys
      security:
        - portalSession: []
      responses:
        "200":
          description: API key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyListResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
    post:
      tags:
        - Portal Web API Keys
      summary: Create a derived customer API key
      operationId: createPortalAPIKey
      security:
        - portalSession: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/APIKeyCreateRequest"
      responses:
        "200":
          description: Created API key and one-time plaintext
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyCreateResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/api-keys/{key_id}/disable:
    post:
      tags:
        - Portal Web API Keys
      summary: Disable a derived customer API key
      operationId: disablePortalAPIKey
      security:
        - portalSession: []
          csrfHeader: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Disabled API key metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKey"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/api-keys/{key_id}/rotate:
    post:
      tags:
        - Portal Web API Keys
      summary: Rotate a derived customer API key
      operationId: rotatePortalAPIKey
      security:
        - portalSession: []
          csrfHeader: []
      parameters:
        - name: key_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Rotated API key and one-time plaintext
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIKeyRotateResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "403":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/tasks:
    get:
      tags:
        - Portal Web Tasks
      summary: List project-scoped tasks
      operationId: listPortalTasks
      security:
        - portalSession: []
      parameters:
        - name: api_key_id
          in: query
          required: false
          schema:
            type: string
        - name: request_id
          in: query
          required: false
          schema:
            type: string
        - name: model
          in: query
          required: false
          schema:
            type: string
        - name: provider_type
          in: query
          required: false
          schema:
            type: string
        - name: channel_id
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: Project-scoped tasks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskListResponse"
        "400":
          $ref: "#/components/responses/ErrorResponse"
        "401":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/tasks/{task_id}:
    get:
      tags:
        - Portal Web Tasks
      summary: Get one project-scoped task
      operationId: getPortalTask
      security:
        - portalSession: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project-scoped task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskObject"
        "401":
          $ref: "#/components/responses/ErrorResponse"
        "404":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/tasks/{task_id}/cancel:
    post:
      tags:
        - Portal Web Tasks
      summary: Reserved task cancel endpoint
      operationId: cancelPortalTask
      security:
        - portalSession: []
          csrfHeader: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "501":
          $ref: "#/components/responses/ErrorResponse"
  /api/portal/v1/settings/project:
    get:
      tags:
        - Portal Web Settings
      summary: Get safe project settings
      operationId: getPortalProjectSettings
      security:
        - portalSession: []
      responses:
        "200":
          description: Safe project settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSettings"
        "401":
          $ref: "#/components/responses/ErrorResponse"
components:
  securitySchemes:
    portalSession:
      type: apiKey
      in: cookie
      name: tg_portal_session
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  responses:
    ErrorResponse:
      description: Stable console error envelope
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    APIKeyLoginRequest:
      type: object
      required:
        - api_key
      properties:
        api_key:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
        - authenticated
        - session
        - csrf_token
      properties:
        authenticated:
          type: boolean
        session:
          $ref: "#/components/schemas/PortalSessionResponse"
        csrf_token:
          type: string
    PortalSessionResponse:
      type: object
      required:
        - authenticated
      properties:
        authenticated:
          type: boolean
        tenant_id:
          type: string
        project_id:
          type: string
        api_key_id:
          type: string
        allowed_models:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        csrf_token:
          type: string
    PortalDashboardResponse:
      type: object
      required:
        - generated_at
        - credits
        - usage
        - api_key_count
        - active_key_count
        - task_summary
        - recent_tasks
      properties:
        generated_at:
          type: string
          format: date-time
        credits:
          $ref: "#/components/schemas/CreditsResponse"
        usage:
          $ref: "#/components/schemas/UsageResponse"
        api_key_count:
          type: integer
        active_key_count:
          type: integer
        task_summary:
          $ref: "#/components/schemas/TaskSummary"
        recent_tasks:
          type: array
          items:
            $ref: "#/components/schemas/TaskObject"
    TaskSummary:
      type: object
      required:
        - total
        - queued
        - processing
        - completed
        - failed
      properties:
        total:
          type: integer
        queued:
          type: integer
        processing:
          type: integer
        completed:
          type: integer
        failed:
          type: integer
    OnboardingState:
      type: object
      required:
        - generated_at
        - steps
      properties:
        generated_at:
          type: string
          format: date-time
        steps:
          type: array
          items:
            $ref: "#/components/schemas/OnboardingStep"
    OnboardingStep:
      type: object
      required:
        - id
        - title
        - complete
      properties:
        id:
          type: string
        title:
          type: string
        complete:
          type: boolean
        description:
          type: string
    ModelListResponse:
      type: object
      required:
        - object
        - data
      properties:
        object:
          type: string
          enum:
            - list
        data:
          type: array
          items:
            $ref: "#/components/schemas/ModelSummary"
    ModelSummary:
      type: object
      required:
        - id
        - object
        - type
        - display_name
        - owner
        - capabilities
        - input_modalities
        - output_modalities
        - async
        - deprecated
        - pricing_summary
      properties:
        id:
          type: string
        object:
          type: string
        type:
          type: string
        category:
          type: string
        display_name:
          type: string
        description:
          type: string
        aliases:
          type: array
          items:
            type: string
        tags:
          type: array
          items:
            type: string
        provider_family:
          type: string
        owner:
          type: string
        capabilities:
          type: array
          items:
            type: string
        input_modalities:
          type: array
          items:
            type: string
        output_modalities:
          type: array
          items:
            type: string
        async:
          type: boolean
        deprecated:
          type: boolean
        context_window:
          type: integer
          format: int64
        max_output_tokens:
          type: integer
          format: int64
        status:
          type: string
        pricing_summary:
          $ref: "#/components/schemas/ModelPricingSummary"
    ModelPricingSummary:
      type: object
      required:
        - configured
        - component_price_count
      properties:
        configured:
          type: boolean
        currency:
          type: string
        category:
          type: string
        components:
          type: array
          items:
            $ref: "#/components/schemas/ModelPricingComponentView"
        input_micros_per_token:
          type: integer
          format: int64
        output_micros_per_token:
          type: integer
          format: int64
        estimated_output_tokens:
          type: integer
          format: int64
        component_price_count:
          type: integer
    ModelPricingComponentView:
      type: object
      required:
        - unit
        - micros_per_unit
      properties:
        unit:
          type: string
        micros_per_unit:
          type: integer
          format: int64
    ModelDetailResponse:
      type: object
      required:
        - model
        - schema
      properties:
        model:
          $ref: "#/components/schemas/ModelSummary"
        schema:
          $ref: "#/components/schemas/ModelSchemaResponse"
    ModelSchemaResponse:
      type: object
      required:
        - model
        - version
        - schema
      properties:
        model:
          type: string
        version:
          type: string
        schema:
          type: object
          additionalProperties: true
    CreditsResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/CreditsBucket"
    CreditsBucket:
      type: object
      required:
        - remaining_credits
        - used_credits
        - unlimited_credits
        - currency
      properties:
        remaining_credits:
          type: number
        used_credits:
          type: number
        held_credits:
          type: number
        unlimited_credits:
          type: boolean
        currency:
          type: string
    UsageResponse:
      type: object
      required:
        - generated_at
        - currency
        - totals
        - items
      properties:
        generated_at:
          type: string
          format: date-time
        currency:
          type: string
        totals:
          $ref: "#/components/schemas/UsageTotals"
        items:
          type: array
          items:
            $ref: "#/components/schemas/UsageItem"
        next_cursor:
          type: string
          nullable: true
    UsageTotals:
      type: object
      required:
        - requests
        - input_tokens
        - output_tokens
        - credits_used
      properties:
        requests:
          type: integer
          format: int64
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        credits_used:
          type: number
    UsageItem:
      type: object
      required:
        - status
        - input_tokens
        - output_tokens
        - credits_used
      properties:
        request_id:
          type: string
        api_key_id:
          type: string
        model:
          type: string
        capability:
          type: string
        provider_type:
          type: string
        channel_id:
          type: string
        status:
          type: string
        input_tokens:
          type: integer
          format: int64
        output_tokens:
          type: integer
          format: int64
        total_tokens:
          type: integer
          format: int64
        credits_used:
          type: number
        created_at:
          type: string
          format: date-time
    APIKeyListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/APIKey"
    APIKey:
      type: object
      required:
        - id
        - name
        - enabled
        - allowed_models
      properties:
        id:
          type: string
        name:
          type: string
        enabled:
          type: boolean
        allowed_models:
          type: array
          items:
            type: string
        ip_allowlist:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true
        usage_summary:
          $ref: "#/components/schemas/UsageTotals"
        created_at:
          type: string
          format: date-time
        revoked_at:
          type: string
          format: date-time
          nullable: true
    APIKeyCreateRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        allowed_models:
          type: array
          items:
            type: string
        ip_allowlist:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    APIKeyCreateResponse:
      type: object
      required:
        - api_key
        - plaintext_key
      properties:
        api_key:
          $ref: "#/components/schemas/APIKey"
        plaintext_key:
          type: string
    APIKeyRotateResponse:
      type: object
      required:
        - api_key
        - plaintext_key
      properties:
        api_key:
          $ref: "#/components/schemas/APIKey"
        plaintext_key:
          type: string
    TaskListResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TaskObject"
        next_cursor:
          type: string
          nullable: true
    TaskObject:
      type: object
      additionalProperties: true
    ProjectSettings:
      type: object
      required:
        - tenant_id
        - project_id
        - api_key_id
        - allowed_models
        - generated_at
      properties:
        tenant_id:
          type: string
        project_id:
          type: string
        api_key_id:
          type: string
        allowed_models:
          type: array
          items:
            type: string
        generated_at:
          type: string
          format: date-time
    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: "#/components/schemas/ErrorBody"
    ErrorBody:
      type: object
      required:
        - code
        - message
        - type
      properties:
        code:
          type: string
          example: unauthorized
        message:
          type: string
        type:
          type: string
        retryable:
          type: boolean
        request_id:
          type: string
